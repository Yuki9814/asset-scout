[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "asset-scout"
version = "0.1.0"
description = "Local-first, rights-aware image and video asset discovery for AI-assisted editing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Asset Scout contributors" }]
dependencies = [
  "av>=16,<17",
  "httpx>=0.27,<1",
  "mcp>=2.0,<3",
  "numpy>=2.0,<3",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
media = [
  "scenedetect>=0.7,<0.8",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
asset-scout = "asset_scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_scout"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
